<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad3)" stroke="rgba(255,255,255,0.1)" stroke-width="8" />
  
  <!-- Outer Neon Shield Hexagon -->
  <polygon points="256,70 410,158 410,334 256,422 102,334 102,158" 
           fill="none" stroke="url(#hexBorderGrad)" stroke-width="24" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- Connecting Learning Nodes Grid inside Hex -->
  <path d="M 256 150 L 256 330 M 170 200 L 342 300 M 170 300 L 342 200" 
        stroke="url(#hexBorderGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6" />

  <!-- Node Dots -->
  <circle cx="256" cy="150" r="18" fill="#06B6D4" />
  <circle cx="170" cy="200" r="18" fill="#3B82F6" />
  <circle cx="342" cy="200" r="18" fill="#3B82F6" />
  <circle cx="170" cy="300" r="18" fill="#8B5CF6" />
  <circle cx="342" cy="300" r="18" fill="#8B5CF6" />
  <circle cx="256" cy="330" r="22" fill="#EC4899" filter="url(#neonGlow)" />

  <!-- Center Target Core -->
  <circle cx="256" cy="240" r="32" fill="#020617" stroke="#06B6D4" stroke-width="8" />
  <circle cx="256" cy="240" r="12" fill="#38BDF8" />
</svg>
